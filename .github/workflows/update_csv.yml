name: Update Postal Code Data

on:
  schedule:
    - cron: '0 0 * * 1'
  
  # 手動でも実行できるようにする
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # リポジトリへの書き込み権限を付与
    
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
      commit_hash: ${{ steps.check-changes.outputs.commit_hash }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3'

      - name: Run update script
        run: python3 scripts/update_csv.py

      - name: Check for changes and commit
        id: check-changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 変更があるか確認
          git status
          
          if git diff --quiet external/utf_ken_all.csv; then
            echo "変更はありませんでした。"
            echo "has_changes=false" >> $GITHUB_OUTPUT            
          else
            git add external/utf_ken_all.csv
            git commit -m "Auto-update csv [skip ci]"
            git push
            
            COMMIT_HASH=$(git rev-parse HEAD)
            echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
  
  # deploy.ymlをghでdispatchするには強力な権限が必要で、セキュリティ問題になるので、仕方なくここにべた書きする
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-data
    if: needs.update-data.outputs.has_changes == 'true'

    concurrency:
      group: "pages"
      cancel-in-progress: true
    
    permissions:
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-data.outputs.commit_hash }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- ビルドコマンドの設定 ---
      - name: Build and Generate
        run: |
          NODE_ENV=production npm run build
          npm run generate

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # generate / build によって生成された静的ファイルが出力されるフォルダを指定してください。
          # 例: './dist', './public', './out', './build' など
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4